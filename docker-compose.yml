version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: textile_mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: textile_fake_news
    volumes:
      - mongo_data:/data/db

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: textile_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URI=mongodb://mongodb:27017
      - DATABASE_NAME=textile_fake_news
      - JWT_SECRET=textile_secure_jwt_secret_key_change_in_production_2026
      - FRONTEND_URL=http://localhost:5173
    depends_on:
      - mongodb

volumes:
  mongo_data:
